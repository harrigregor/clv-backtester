name: Weekly CLV Backtest

# Runs every Monday 06:00 UTC, and on manual trigger.
# Regenerates synthetic data (or, if you wire in a real data source via the
# DATA step below, real data), reruns both backtests, and commits the updated
# results.json so the dashboard refreshes itself — hands-off.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ---- DATA STEP ----------------------------------------------------
      # Pull real historical data from football-data.co.uk and
      # tennis-data.co.uk (GitHub runners have open network access).
      # Synthetic samples are generated only as a fallback.
      - name: Fetch real data
        run: |
          echo "=== Fetching real data ==="
          python src/fetch_data.py
          echo "=== Files in data/ after fetch ==="
          ls -la data/
          echo "=== Ensuring synthetic fallback exists ==="
          python src/make_synthetic.py

      - name: Run backtests
        run: python src/run.py

      - name: Commit updated results
        run: |
          git config user.name "clv-bot"
          git config user.email "actions@github.com"
          git add results/results.json
          if git diff --staged --quiet; then
            echo "No changes to results."
            exit 0
          fi
          git commit -m "Auto: weekly CLV backtest $(date -u +%Y-%m-%d)"
          # Retry loop: fetch + rebase + push, up to 5 times, so a remote that
          # moved between our checkout and push can never make the job fail.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || git rebase --abort
            if git push origin main; then
              echo "Pushed on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 3
          done
          echo "Could not push after 5 attempts (non-fatal)."
          exit 0
